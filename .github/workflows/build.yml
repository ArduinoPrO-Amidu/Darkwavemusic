
name: Build MP3 Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Locate Gradle Wrapper
        id: gradle
        run: |
          WRAPPER=$(find . -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found!"
            echo "Repository structure:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          chmod +x "$WRAPPER"
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle wrapper in: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "${{ steps.gradle.outputs.project_dir }}"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MP3-Player-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error


